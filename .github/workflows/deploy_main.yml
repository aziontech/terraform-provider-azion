name: Deploy to Production

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions: {}

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    # No toolchain is set up here on purpose. The only real step is a Docker
    # action that pings goreportcard.com to refresh the badge; it runs in its own
    # container and compiles nothing, so a Go image (or actions/setup-go) would
    # just be an unused dependency.
    steps:
      - name: Checkout code
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
        with:
          fetch-depth: 0

      - name: Go Report
        uses: creekorful/goreportcard-action@1f35ced8cdac2cba28c9a2f2288a16aacfd507f9 # v1.0

