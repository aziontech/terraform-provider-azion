# Terraform Provider release workflow.
name: Release

# Releases are started manually. The run creates the version tag itself (see the
# bump step below) and goreleaser then publishes that tag.
#
# Deliberately no `push: tags` trigger. With one, a hand-pushed tag would start a
# run that bumps and pushes a *second* tag onto the same commit, and goreleaser
# would be free to publish the wrong one. Manual dispatch keeps exactly one tag
# per release.
on:
  workflow_dispatch:

# Minimal default token permissions; the release job elevates to contents: write
# because GitHub considers creating releases and uploading assets as writing contents.
permissions:
  contents: read

jobs:
  goreleaser:
    # Gates the release behind the `release` environment: the job parks in
    # Waiting until an approver signs off, and GitHub refuses it outright if the
    # dispatched ref is not allowed by the environment's deployment branch rule.
    # No runner is started, and no secret is provisioned, before that.
    environment: release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
        with:
          # Allow goreleaser to access older tag information.
          fetch-depth: 0
      - uses: actions/setup-go@be3c94b385c4f180051c996d336f57a34c397495 # v3.6.1
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@d6f3f49f3345e29369fe57596a3ca8f94c4d2ca7 # v5.4.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - name: Bump version and push tag
        id: tag_ver
        uses: anothrNick/github-tag-action@3272e7a58f6c71ee9ede35f53b114e1bb9a91347 # 1.37.0
        env:
          RELEASE_BRANCHES: master,main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: true

      - name: Refresh git
        run: git fetch --tags
        
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@b508e2e3ef3b19d4e4146d4f8fb3ba9db644a757 # v3.2.0
        with:
          args: release --clean
        env:
          # GitHub sets the GITHUB_TOKEN secret automatically.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
